<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>GoatedMath Style 🔥</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background:
          radial-gradient(circle at top left, #00f7ff33, transparent 30%),
          radial-gradient(circle at bottom right, #ff00aa33, transparent 30%),
          linear-gradient(135deg, #050816, #0f172a, #111827);

        animation: bgMove 10s ease infinite;
      }

      @keyframes bgMove {
        0% {
          filter: hue-rotate(0deg);
        }

        100% {
          filter: hue-rotate(360deg);
        }
      }

      /* Floating Glow Balls */

      .orb {
        position: absolute;
        border-radius: 50%;

        filter: blur(60px);

        opacity: 0.6;

        animation: float 8s infinite ease-in-out;
      }

      .orb1 {
        width: 250px;
        height: 250px;

        background: #00f7ff;

        top: 10%;
        left: 10%;
      }

      .orb2 {
        width: 300px;
        height: 300px;

        background: #ff00aa;

        bottom: 10%;
        right: 10%;

        animation-delay: 2s;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-30px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      /* Main Card */

      .card {
        position: relative;

        width: 420px;

        padding: 40px;

        border-radius: 30px;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.2);

        backdrop-filter: blur(15px);

        text-align: center;

        box-shadow:
          0 0 30px rgba(0, 247, 255, 0.2),
          0 0 60px rgba(255, 0, 170, 0.15);

        animation: pop 2s infinite alternate;
      }

      @keyframes pop {
        from {
          transform: scale(1);
        }

        to {
          transform: scale(1.03);
        }
      }

      /* Fake Logo Style */

      .logo {
        width: 120px;
        height: 120px;

        margin: auto;
        margin-bottom: 25px;

        border-radius: 25px;

        background:
          linear-gradient(135deg, #00f7ff, #ff00aa);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 3rem;
        font-weight: bold;
        color: white;

        box-shadow:
          0 0 25px #00f7ff,
          0 0 40px #ff00aa;
      }

      h1 {
        color: white;

        font-size: 3rem;

        letter-spacing: 2px;

        margin-bottom: 10px;

        text-shadow:
          0 0 10px #00f7ff,
          0 0 20px #ff00aa;
      }

      p {
        color: #d1d5db;

        font-size: 1.1rem;

        line-height: 1.6;
      }

      /* Floating Symbols */

      .symbols span {
        position: absolute;

        color: rgba(255,255,255,0.15);

        font-size: 2rem;

        animation: symbols 12s linear infinite;
      }

      @keyframes symbols {
        from {
          transform: translateY(100vh) rotate(0deg);
        }

        to {
          transform: translateY(-20vh) rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="symbols">
      <span style="left: 10%; animation-delay: 0s;">π</span>
      <span style="left: 25%; animation-delay: 2s;">√</span>
      <span style="left: 45%; animation-delay: 4s;">∞</span>
      <span style="left: 70%; animation-delay: 1s;">∑</span>
      <span style="left: 85%; animation-delay: 5s;">Δ</span>
    </div>

    <div class="card">
      <div class="logo">GM</div>

      <h1>GOATEDMATH</h1>

      <p>
        Smart vibes. Neon glow. Math but actually cool. 🔥
      </p>
    </div>
  </body>
</html>
