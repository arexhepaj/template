<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>67 PHONK 🔥</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        background: radial-gradient(circle, #111, #000);

        font-family: Arial, sans-serif;
      }

      /* Background Glow */
      .glow {
        position: absolute;
        width: 600px;
        height: 600px;

        background: linear-gradient(
          45deg,
          #ff004c,
          #7b00ff,
          #00d0ff
        );

        filter: blur(120px);

        animation: spin 10s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      /* Main Text */
      .title {
        position: relative;

        font-size: 8rem;
        font-weight: 900;

        color: white;

        text-transform: uppercase;

        animation:
          bounce 2s infinite,
          glowText 2s infinite alternate;

        z-index: 2;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.1);
        }
      }

      @keyframes glowText {
        from {
          text-shadow:
            0 0 10px #ff004c,
            0 0 20px #ff004c,
            0 0 40px #7b00ff;
        }

        to {
          text-shadow:
            0 0 20px #00d0ff,
            0 0 40px #7b00ff,
            0 0 80px #ff004c;
        }
      }

      /* Moving Lines */
      .line {
        position: absolute;

        width: 200%;
        height: 2px;

        background: rgba(255, 255, 255, 0.2);

        animation: moveLines 4s linear infinite;
      }

      .line:nth-child(2) {
        top: 30%;
      }

      .line:nth-child(3) {
        top: 70%;
        animation-delay: 2s;
      }

      @keyframes moveLines {
        from {
          transform: translateX(-50%);
        }

        to {
          transform: translateX(0%);
        }
      }

      /* Floating Particles */
      .particles span {
        position: absolute;

        color: white;

        animation: float 6s linear infinite;

        opacity: 0.7;
      }

      @keyframes float {
        from {
          transform: translateY(100vh) scale(0);
        }

        to {
          transform: translateY(-10vh) scale(1.5);
        }
      }
    </style>
  </head>

  <body>
    <div class="glow"></div>

    <div class="line"></div>
    <div class="line"></div>

    <div class="particles">
      <span style="left: 10%; animation-delay: 0s;">🔥</span>
      <span style="left: 25%; animation-delay: 1s;">⚡</span>
      <span style="left: 40%; animation-delay: 2s;">🔥</span>
      <span style="left: 60%; animation-delay: 3s;">⚡</span>
      <span style="left: 80%; animation-delay: 4s;">🔥</span>
    </div>

    <h1 class="title">67 PHONK</h1>
  </body>
</html>
